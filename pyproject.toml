[project]
name = "realtime-qa"
version = "0.1.0"
description = "Local microphone-to-scorecard showcase for System One decision models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "nicegui==3.17.1",
    "numpy==2.2.6",
    "pydantic==2.13.5",
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "sounddevice==0.5.6",
]

[tool.uv]
package = false
exclude-newer = "2026-09-28T00:00:00Z"

[tool.pytest.ini_options]
addopts = "-p nicegui.testing.user_plugin"
main_file = ""
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "playwright==1.55.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]
